  <style>

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-2);
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .cert-card {
      padding: var(--space-3);
      background: var(--band-surface);
      border: 1px solid var(--band-line);
      border-left: 3px solid var(--band-heading);
      border-radius: var(--radius);
    }

    .cert-school {
      margin: 0 0 var(--space-2);
      font-family: var(--font-heading);
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--band-heading);
    }

    .cert-form {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }

    .cert-input {
      flex: 1;
      min-width: 0;
      padding: 0.65rem 0.8rem;

      font-family: var(--font-ui);
      font-size: 0.9rem;
      letter-spacing: 0.15em;

      color: var(--band-fg);
      background: transparent;

      border: 1px solid var(--band-line-strong);
      border-radius: var(--radius);
    }

    .cert-input::placeholder {
      letter-spacing: 0.05em;
      color: var(--band-fg-dim);
    }

    .cert-input:focus-visible {
      outline: 2px solid var(--band-heading);
      outline-offset: 1px;
    }

    .cert-go {
      flex: none;
      width: 46px;

      color: var(--band-bg);
      background: var(--band-heading);

      border: 1px solid var(--band-heading);
      border-radius: var(--radius);

      cursor: pointer;
      font-size: 1.1rem;

      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .cert-go:hover {
      opacity: 0.85;
      transform: translateX(2px);
    }

    .cert-msg {
      margin: 0.65rem 0 0;
      min-height: 1.2em;

      font-family: var(--font-ui);
      font-size: 0.78rem;

      color: var(--band-fg-dim);
    }

    .cert-msg.is-error {
      color: var(--thread-music);
      font-weight: 500;
    }

    .cert-msg.is-success {
      color: var(--band-heading);
      font-weight: 500;
    }

    .cert-links {
      display: grid;
      gap: 0.5rem;

      margin: 0.8rem 0 0;
      padding: 0;

      list-style: none;
    }

    .cert-links a {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0.65rem 0.8rem;

      color: var(--band-heading);
      text-decoration: none;

      font-family: var(--font-ui);
      font-size: 0.8rem;
      font-weight: 500;

      border: 1px solid var(--band-line);
      border-radius: var(--radius);

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s ease;
    }

    .cert-links a:hover {
      background: var(--band-surface);
      border-color: var(--band-heading);
      transform: translateX(2px);
    }

    .event-name {
      flex: 1;
    }

    .event-arrow {
      margin-left: 0.75rem;
      font-size: 1rem;
    }

    .cert-card.unlocked {
      border-left-width: 4px;
    }

    .cert-card.unlocked .cert-input {
      border-color: var(--band-heading);
    }

    @media (max-width: 600px) {

      .cert-grid {
        grid-template-columns: 1fr;
      }

      .cert-form {
        gap: 0.4rem;
      }

      .cert-go {
        width: 42px;
      }

/* =========================================================
   BUILD ALL SCHOOL CARDS
   ========================================================= */

const grid = document.getElementById("certificateGrid");

Object.entries(certificateData).forEach(function ([schoolName, data], index) {

  const card = document.createElement("li");

  card.className = "cert-card";

  card.dataset.school = schoolName;


  card.innerHTML = `

    <p class="cert-school">
      ${schoolName}
    </p>

    <form class="cert-form" novalidate>

      <label
        class="visually-hidden"
        for="certificate-code-${index}"
      >
        Code for ${schoolName}
      </label>

      <input
        class="cert-input"
        id="certificate-code-${index}"
        type="text"
        inputmode="numeric"
        maxlength="6"
        autocomplete="off"
        spellcheck="false"
        placeholder="6-digit code"
      >

      <button
        class="cert-go"
        type="submit"
        aria-label="Open certificates for ${schoolName}"
      >
        &rarr;
      </button>

    </form>

    <p
      class="cert-msg"
      role="status"
      aria-live="polite"
    ></p>

    <ul
      class="cert-links"
      hidden
    ></ul>

  `;


  grid.appendChild(card);


  const form = card.querySelector(".cert-form");

  const input = card.querySelector(".cert-input");

  const message = card.querySelector(".cert-msg");

  const linksList = card.querySelector(".cert-links");


  /* =======================================================
     FORM SUBMISSION
     ======================================================= */

  form.addEventListener("submit", function (event) {

    event.preventDefault();


    const enteredCode =
      input.value.replace(/\D/g, "");


    /* Reset previous state */

    message.textContent = "";

    message.classList.remove("is-error");

    message.classList.remove("is-success");

    linksList.innerHTML = "";

    linksList.hidden = true;

    card.classList.remove("unlocked");


    /* =====================================================
       CHECK CODE
       ===================================================== */

    if (enteredCode !== data.code) {

      message.textContent =
        "Invalid code. Please check your school's 6-digit access code.";

      message.classList.add("is-error");

      input.focus();

      return;

    }


    /* =====================================================
       CODE IS CORRECT
       ===================================================== */

    card.classList.add("unlocked");


    message.classList.add("is-success");


    /* =====================================================
       NO CERTIFICATE LINKS
       ===================================================== */

    if (!data.folders || data.folders.length === 0) {

      message.textContent =
        "Code accepted — certificates are not uploaded yet.";

      return;

    }


    /* =====================================================
       CREATE EVENT LINKS
       ===================================================== */

    data.folders.forEach(function (folder) {

      const li = document.createElement("li");

      const link = document.createElement("a");

      const name = document.createElement("span");

      const arrow = document.createElement("span");


      name.className = "event-name";

      name.textContent =
        folder.event + " — View Certificates";


      arrow.className = "event-arrow";

      arrow.innerHTML = "&nearr;";


      link.href = folder.url;

      link.target = "_blank";

      link.rel = "noopener noreferrer";


      link.appendChild(name);

      link.appendChild(arrow);

      li.appendChild(link);

      linksList.appendChild(li);

    });


    linksList.hidden = false;


    message.textContent =
      "Code accepted — select an event below to view your certificates.";

  });


  /* =======================================================
     ONLY ALLOW NUMBERS IN CODE FIELD
     ======================================================= */

  input.addEventListener("input", function () {

    this.value =
      this.value
        .replace(/\D/g, "")
        .slice(0, 6);

  });

});
